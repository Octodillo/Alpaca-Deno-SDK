name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.14"
      - run: "deno fmt --check"
      - run: "deno lint"
      - run: "deno task check"
      - run: "deno task test"
